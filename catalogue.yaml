# Catalogue des clés Mycoclé : une entrée par clé publiée par l'API.
#
# L'identifiant (la clé de chaque entrée) apparaît dans les adresses de
# l'API : il ne doit plus changer une fois publié. Les fichiers .cle
# gardent leur nom ; c'est ici qu'on dit ce que chacun est.
#
#   file          chemin du .cle dans ce dépôt (obligatoire)
#   compiledFile  sa version compilée "_C", s'il y en a une
#   title         titre affiché (obligatoire)
#   taxa          taxons traités : [Amanita]
#   authors       auteurs de la clé d'origine : [Häffner J.]
#   year          année de la clé d'origine
#   language      fr, en, de, it, es, ca, pt, nl, da, sv, no, fi, cs, pl, ru, la
#   category      mycologie, myxomycetes, lichens-bryophytes, botanique, divers
#   reference     publication d'origine
#   translators   traducteurs
#   notes         crédits de l'adaptation à Mycoclé, remarques
#   hidden        true : gardée ici mais pas publiée
#   review        champs devinés à vérifier : retirer ceux qui sont relus
#
# Premier jet écrit par `bin/console app:catalogue:draft` (mycocle-api).
