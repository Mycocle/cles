  cle-des-ciboria-botany-and:
    file: Mycologie/Ciboria_key_C.cle
    title: 'Clé des ciboria / Botany and Plant Physiology, Department of Biology, University of Oslo'
    taxa: [Ciboria]
    language: en
    category: mycologie
    notes: 'Type species: Ciboria caucus (Reb.:Fr.) Fuckel. Ciboria is a heterogeneous assemblance of species characterized by ± determinate stromata, an apothecial outer excipulum consisting of globose cells (textura globulosa) NOT embedded in a gelatinous matrix, and hyaline, unicellular ascospores. The genus is probably polyphyletic. The species on catkins of amentiferous trees constitute a monophyletic group. Based on scientific evidence and educated guess we distinguish five groups within the genus, the true Ciboria (on catkins), the warted-spored Ciboria , which are presumably obligate parasites and produce apothecia on fruits of amentiferous trees, the deciduous leaf inhabitants, forming a ± well differentiated stroma on leaves of deciduous trees, the herbaceous plant inhabitants, nutritioning on plant remnants of various kind (for groups three and four, see also Rutstroemia), and a fifth group of incommon features, consisting of presumably unrelated taxa classified on the basis of stromatal type.'
    review: [title, authors, language, taxa]
